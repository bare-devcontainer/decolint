name: Regenerate dockerflags

# Renovate bumps docker/cli in cmd/dockerflagsgen but cannot run "make dockerflags", so the CI
# "dockerflags" job fails on every such pull request. This commits the regenerated table to the
# Renovate branch, where it is still reviewed as part of the pull request.
#
# On any other pull request, such as one editing this workflow, only the App token is created: it
# still checks that the App can write to the repository, without changing the branch.
on:
  pull_request:
    paths:
      - cmd/dockerflagsgen/go.mod
      - .github/workflows/dockerflags-regen.yml

permissions: {}
cache-mode: none

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  # Runs the generator, and with it docker/cli's code, without any credential that can write to
  # the repository.
  generate:
    # A fork's pull request gets no secrets, and its branch is not ours to push to.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    cache-mode: read
    outputs:
      contents: ${{ steps.diff.outputs.contents }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make dockerflags
      - id: diff
        run: |
          if ! git diff --quiet dockerargs/runflags.go; then
            echo "contents=$(base64 -w0 dockerargs/runflags.go)" >> "$GITHUB_OUTPUT"
          fi

  commit:
    needs: generate
    if: >-
      needs.generate.outputs.contents != '' ||
      github.event.pull_request.user.login != 'renovate[bot]'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      # A commit made with GITHUB_TOKEN does not trigger workflows, which would leave it without CI.
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.HOUSEKEEPER_CLIENT_ID }}
          private-key: ${{ secrets.HOUSEKEEPER_PRIVATE_KEY }}
          permission-contents: write
      # Committing through the API, not "git push", makes GitHub sign the commit and attribute it
      # to the App, as the main ruleset requires. The App's bot is listed in Renovate's
      # gitIgnoredAuthors, so Renovate keeps updating the branch. If the branch moved since
      # generation, expectedHeadOid fails the commit; the run for the newer commit regenerates.
      - if: github.event.pull_request.user.login == 'renovate[bot]'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          CONTENTS: ${{ needs.generate.outputs.contents }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          jq -n \
            --arg repository "$REPOSITORY" \
            --arg branch "$HEAD_REF" \
            --arg head "$HEAD_SHA" \
            --arg contents "$CONTENTS" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repository, branchName: $branch},
                expectedHeadOid: $head,
                message: {headline: "chore(deps): regenerate dockerargs/runflags.go"},
                fileChanges: {additions: [{path: "dockerargs/runflags.go", contents: $contents}]}
              }}
            }' |
            gh api graphql --input -
