name: Schema sync

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Refresh vendored schemas from upstream
        run: make update-schemas
      - name: Fail if the vendored schemas are stale
        run: |
          if ! git diff --exit-code schema/data; then
            echo "::error::Vendored Dev Container schemas are out of date. Run 'make update-schemas' and commit schema/data." >&2
            exit 1
          fi
