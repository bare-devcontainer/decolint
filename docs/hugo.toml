baseURL = "https://bare-devcontainer.github.io/decolint/"
title = "decolint"
locale = "en-us"
enableRobotsTXT = true

# A rule reference has no feed, tags or categories pages; the only taxonomy is the category each
# rule already carries in its front matter, which the rules section renders itself.
disableKinds = ["taxonomy", "term", "RSS"]

# Findings link to a rule's page by an address derived from its ID (see rules.DocsURL), so the
# published paths have to stay /rules/<rule-id>/.
[permalinks]
  rules = "/rules/:slug/"

[params]
  description = "A linter for Dev Container configuration files."
  repository = "https://github.com/bare-devcontainer/decolint"

# Most content is generated by "go run ./cmd/docgen" (see the Makefile) into .generated/content —
# the rule pages from rules/*.go, and the landing/getting-started/reference pages from README.md —
# so it is mounted alongside the handful of pages (docs/content/rules/_index.md) that are still
# hand-written. Declaring any module mount opts out of Hugo's implicit defaults, so every directory
# the site needs is listed here.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = ".generated/content"
    target = "content"
  [[module.mounts]]
    source = "layouts"
    target = "layouts"
  [[module.mounts]]
    source = "assets"
    target = "assets"
  [[module.mounts]]
    source = "data"
    target = "data"

[markup.highlight]
  # Emit token classes rather than inline styles, so the colors live in the site's own stylesheet
  # and follow the reader's light or dark preference.
  noClasses = false

# Resolve links written as relative Markdown paths, e.g. [Rules](rules/no-app-port.md), to the
# published address of the page. Pages then read correctly both on the site and on GitHub.
[markup.goldmark.renderHooks.link]
  useEmbedded = "fallback"

[markup.goldmark.renderer]
  # Rule pages are written by contributors and rendered as-is; nothing needs raw HTML.
  unsafe = false

# endLevel = 3 so Getting started's step-by-step h3 subsections ("### 1. Run it", ...) show in its
# sidebar TOC; Reference has only one h3 ("### Rule categories"), so this costs it nothing.
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[[menus.main]]
  name = "Getting started"
  pageRef = "/getting-started"
  weight = 10

[[menus.main]]
  name = "Rules"
  pageRef = "/rules"
  weight = 20

[[menus.main]]
  name = "Reference"
  pageRef = "/reference"
  weight = 30
