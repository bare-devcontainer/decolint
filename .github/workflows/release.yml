name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .release-please-manifest.json
      - release-please-config.json

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}
cache-mode: none

# The runner's default shell adds only -e, so an unset variable or a failure
# mid-pipeline would otherwise pass silently.
defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  # Opens the release PR, and creates a draft release once it is merged. The
  # draft is published only after every asset is attached, since immutable
  # releases reject later uploads. If a later job fails, re-run the failed
  # jobs: a fresh run would not create the release again.
  #
  # The job runs on pull requests too, with its steps skipped, so that the
  # jobs after it are not skipped with it.
  release-please:
    permissions: {}
    runs-on: ubuntu-slim
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # A GitHub App token, because a release PR opened with GITHUB_TOKEN
      # would not trigger CI.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: github.event_name == 'push'
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: github.event_name == 'push'
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

  prepare:
    permissions: {}
    needs: release-please
    if: github.event_name == 'pull_request' || needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-slim
    outputs:
      release_ref: ${{ steps.decide.outputs.release_ref }}
      tag_name: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Decide release ref
        id: decide
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          echo "### Release Summary" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$TAG_NAME" ]; then
            release_ref=$TAG_NAME
          else
            release_ref=pr-$PR_NUMBER
            echo "- Pull request build. Skipping sign/attest/release." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Version: \`$release_ref\`" >> "$GITHUB_STEP_SUMMARY"
          echo "release_ref=$release_ref" >> "$GITHUB_OUTPUT"

  build:
    permissions:
      contents: read
    cache-mode: read
    needs: prepare
    env:
      RELEASE_REF: ${{ needs.prepare.outputs.release_ref }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          bin=decolint
          if [ "$GOOS" = "windows" ]; then bin=decolint.exe; fi
          make build VERSION="$RELEASE_REF" OUTPUT="dist/$bin"
      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd dist
          name="decolint_${RELEASE_REF}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            zip "$name.zip" decolint.exe
            rm decolint.exe
          else
            tar -czf "$name.tar.gz" decolint
            rm decolint
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.run_id }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  checksums:
    permissions:
      contents: read
    needs: [build, prepare]
    env:
      CHECKSUMS_FILE: decolint_${{ needs.prepare.outputs.release_ref }}_checksums.txt
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-${{ github.run_id }}-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- * > "../$CHECKSUMS_FILE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums-${{ github.run_id }}
          path: ${{ env.CHECKSUMS_FILE }}
          if-no-files-found: error
          retention-days: 1

  sign:
    permissions:
      id-token: write
      contents: read
    needs: [checksums, prepare]
    if: needs.prepare.outputs.tag_name != ''
    env:
      CHECKSUMS_FILE: decolint_${{ needs.prepare.outputs.release_ref }}_checksums.txt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums-${{ github.run_id }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums with cosign
        run: |
          cosign sign-blob --yes \
            --bundle "$CHECKSUMS_FILE.sigstore.json" \
            "$CHECKSUMS_FILE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signature-${{ github.run_id }}
          path: ${{ env.CHECKSUMS_FILE }}.sigstore.json
          if-no-files-found: error
          retention-days: 1

  attest:
    permissions:
      id-token: write
      attestations: write
      contents: read
    needs: [checksums, prepare]
    if: needs.prepare.outputs.tag_name != ''
    env:
      CHECKSUMS_FILE: decolint_${{ needs.prepare.outputs.release_ref }}_checksums.txt
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums-${{ github.run_id }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ env.CHECKSUMS_FILE }}

  docker:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    cache-mode: read
    needs: prepare
    env:
      RELEASE_REF: ${{ needs.prepare.outputs.release_ref }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve revision
        id: revision
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/bare-devcontainer/decolint
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}},value=${{ needs.prepare.outputs.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.prepare.outputs.tag_name }}
            type=semver,pattern={{major}},value=${{ needs.prepare.outputs.tag_name }}
      - name: Log in to GHCR
        if: needs.prepare.outputs.tag_name != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.tag_name != '' }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ env.RELEASE_REF }}
            REVISION=${{ steps.revision.outputs.short_sha }}
      - name: Attest image provenance
        if: needs.prepare.outputs.tag_name != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/bare-devcontainer/decolint
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    permissions:
      actions: write
      contents: write
    needs: [checksums, sign, attest, docker, prepare]
    if: needs.prepare.outputs.tag_name != ''
    env:
      CHECKSUMS_FILE: decolint_${{ needs.prepare.outputs.release_ref }}_checksums.txt
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-${{ github.run_id }}-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums-${{ github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signature-${{ github.run_id }}
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}
        run: |
          gh release upload "$TAG_NAME" --clobber \
            dist/* "$CHECKSUMS_FILE" "$CHECKSUMS_FILE.sigstore.json"
          gh release edit "$TAG_NAME" --draft=false
          gh workflow run attest-check.yml --ref main
