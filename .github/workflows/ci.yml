name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}
cache-mode: none

# The runner's default shell adds only -e, so an unset variable or a failure
# mid-pipeline would otherwise pass silently.
defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    cache-mode: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - run: make test

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    cache-mode: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint

  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    cache-mode: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # cmd/docgen regenerates the site's content from rules/*.go and README.md, and rewrites
      # README's rules table from the same rule catalog; a diff here means one of those drifted
      # from the other and a commit forgot to run "make docs-content".
      - run: make docs-content
      - run: git diff --exit-code README.md

  dockerflags:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    cache-mode: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # cmd/dockerflagsgen reads the "docker run" flags out of docker/cli itself. A diff here means
      # the pinned docker/cli changed one decolint parses "runArgs" with, which decides where in the
      # array a rule reads a value from; it should arrive as a reviewable diff rather than as
      # findings that quietly stop matching what Docker does.
      - run: make dockerflags
      - run: git diff --exit-code dockerargs/runflags.go
      - run: make dockerflags-test

  dogfooding:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    cache-mode: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make build
      - run: ./bin/decolint --format=github --deny-warnings --platform=vscode,codespaces .

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    cache-mode: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
