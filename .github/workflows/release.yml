name: Release

on:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  RELEASE_REF: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  CHECKSUMS_FILE: decolint_${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}_checksums.txt

jobs:
  prepare:
    permissions:
      contents: read
    runs-on: ubuntu-slim
    outputs:
      skip_build: ${{ steps.decide.outputs.skip_build }}
      skip_release: ${{ steps.decide.outputs.skip_release }}
    steps:
      - name: Summary
        run: |
          {
            echo "### Release Summary"
            echo "- Version: \`$RELEASE_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Decide release actions
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IS_PULL_REQUEST: ${{ github.event_name == 'pull_request' }}
        run: |
          is_semver=false
          if [[ "$RELEASE_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            is_semver=true
          fi

          release_exists=false
          if [ "$IS_PULL_REQUEST" != "true" ] && [ "$is_semver" = "true" ] && gh release view "$RELEASE_REF" >/dev/null 2>&1; then
            release_exists=true
            echo "- Release \`$RELEASE_REF\` already exists. Skipping build." >> "$GITHUB_STEP_SUMMARY"
          fi

          skip_release=false
          if [ "$IS_PULL_REQUEST" = "true" ] || [ "$is_semver" != "true" ]; then
            skip_release=true
            echo "- Version \`$RELEASE_REF\` is not a release candidate. Skipping sign/attest/release." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$release_exists" = "true" ]; then
            skip_release=true
          fi

          echo "skip_build=$release_exists" >> "$GITHUB_OUTPUT"
          echo "skip_release=$skip_release" >> "$GITHUB_OUTPUT"

  build:
    permissions:
      contents: read
    needs: prepare
    if: needs.prepare.outputs.skip_build != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          bin=decolint
          if [ "$GOOS" = "windows" ]; then bin=decolint.exe; fi
          make build VERSION="$RELEASE_REF" OUTPUT="dist/$bin"
      - name: Package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          cd dist
          name="decolint_${RELEASE_REF}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            zip "$name.zip" decolint.exe
            rm decolint.exe
          else
            tar -czf "$name.tar.gz" decolint
            rm decolint
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ github.run_id }}-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  checksums:
    permissions:
      contents: read
    needs: build
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-${{ github.run_id }}-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum -- * > "../$CHECKSUMS_FILE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksums-${{ github.run_id }}
          path: ${{ env.CHECKSUMS_FILE }}
          if-no-files-found: error
          retention-days: 1

  sign:
    permissions:
      id-token: write
      contents: read
    needs: [checksums, prepare]
    if: needs.prepare.outputs.skip_release != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums-${{ github.run_id }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign checksums with cosign
        run: |
          cosign sign-blob --yes \
            --bundle "$CHECKSUMS_FILE.sigstore.json" \
            "$CHECKSUMS_FILE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signature-${{ github.run_id }}
          path: ${{ env.CHECKSUMS_FILE }}.sigstore.json
          if-no-files-found: error
          retention-days: 1

  attest:
    permissions:
      id-token: write
      attestations: write
      contents: read
    needs: [checksums, prepare]
    if: needs.prepare.outputs.skip_release != 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums-${{ github.run_id }}
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-checksums: ${{ env.CHECKSUMS_FILE }}

  docker:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs: prepare
    if: needs.prepare.outputs.skip_build != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Resolve revision
        id: revision
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/bare-devcontainer/decolint
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - name: Log in to GHCR
        if: needs.prepare.outputs.skip_release != 'true'
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.prepare.outputs.skip_release != 'true' }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ env.RELEASE_REF }}
            REVISION=${{ steps.revision.outputs.short_sha }}
      - name: Attest image provenance
        if: needs.prepare.outputs.skip_release != 'true'
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ghcr.io/bare-devcontainer/decolint
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  release:
    permissions:
      actions: write
      contents: write
    needs: [checksums, sign, attest, docker, prepare]
    if: needs.prepare.outputs.skip_release != 'true'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-${{ github.run_id }}-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksums-${{ github.run_id }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signature-${{ github.run_id }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "$TAG_NAME" \
            dist/* "$CHECKSUMS_FILE" "$CHECKSUMS_FILE.sigstore.json" \
            --title "$TAG_NAME" \
            --generate-notes
          gh workflow run attest-check.yml \
            --repo "${REPO}" \
            --ref main
