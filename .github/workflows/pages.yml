name: Pages

# Builds the documentation site in docs/ and publishes it to GitHub Pages. A pull request builds it
# too, without deploying, so a page that breaks the build is caught before it is merged.
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

# One deployment at a time, and never cancel one in flight: a half-published site is worse than a
# late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # The site's url and baseurl are set in docs/_config.yml rather than taken from the Pages API,
      # so the build needs no repository settings and runs the same on a fork.
      - uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1.0.13
        with:
          source: ./docs
          destination: ./_site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
